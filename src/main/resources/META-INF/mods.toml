modLoader="javafml"
loaderVersion="${loader_version_range}"
license="MIT"
issueTrackerURL="https://example.invalid/issues"

[[mixins]]
config="endsustain.mixins.json"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
logoFile="endsustain.png"
description='''${mod_description}'''

# ---- Minecraft / Forge ----
[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# ---- Boss 词条前置 ----
[[dependencies.${mod_id}]]
    modId="champions"
    mandatory=true
    versionRange="[1.20.1-2.1.6.9-release,)"
    ordering="AFTER"
    side="BOTH"

